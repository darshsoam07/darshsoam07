<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="250" fill="none">
  <defs>
    <radialGradient id="amberAura" cx="82%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#997A3A" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#997A3A" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#FAF7F2" />
    </linearGradient>
    <linearGradient id="pulseBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E2A27" />
      <stop offset="50%" stop-color="#D4AF37">
        <animate attributeName="stop-color" values="#2E2A27;#D4AF37;#FAF7F2;#D4AF37;#2E2A27" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2E2A27" />
    </linearGradient>
  </defs>

  <style>
    .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; fill: #D4AF37; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, "Playfair Display", "Cinzel", Georgia, serif; font-size: 34px; fill: #FAF7F2; font-weight: 600; letter-spacing: 2px; }
    .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13.5px; fill: #A8A29E; font-weight: 300; }
    .techline { font-family: "SF Mono", "JetBrains Mono", Consolas, monospace; font-size: 10.5px; fill: #997A3A; letter-spacing: 1.5px; }
  </style>

  <!-- Background Base -->
  <rect width="920" height="250" rx="12" fill="#0C0A09" stroke="url(#pulseBorder)" stroke-width="1.2" />
  <rect width="920" height="250" rx="12" fill="url(#amberAura)" />

  <!-- Horological & Precision Hairlines -->
  <g opacity="0.22" stroke="#2E2A27" stroke-width="0.8">
    <line x1="55" y1="0" x2="55" y2="250" />
    <line x1="280" y1="0" x2="280" y2="250" />
    <line x1="0" y1="185" x2="920" y2="185" />
  </g>

  <!-- Horological Mechanical Caliper / Orbital Graphic -->
  <g transform="translate(780, 125)">
    <circle r="72" stroke="#2E2A27" stroke-width="1" fill="none" stroke-dasharray="3, 6" />
    <circle r="52" stroke="#1C1917" stroke-width="7" fill="none" />
    <circle r="52" stroke="#997A3A" stroke-width="1" fill="none" stroke-opacity="0.3" />
    <circle r="38" stroke="#D4AF37" stroke-width="1.4" fill="none" stroke-dasharray="35, 15">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle r="18" stroke="#2E2A27" stroke-width="1" fill="#1C1917" />
    <circle r="4" fill="#D4AF37">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Content Hierarchy -->
  <g transform="translate(50, 68)">
    <text class="kicker" x="0" y="0">Cloud Infrastructure • Systems Reliability • Agentic AI</text>
    <text class="heading" x="0" y="40">DARSH SOAM</text>
    <text class="body" x="0" y="72">From a commit to an observable, resilient production service.</text>
    <line x1="0" y1="90" x2="440" y2="90" stroke="url(#goldRule)" stroke-width="1.2" opacity="0.75" />
    <text class="techline" x="0" y="115">AWS • TERRAFORM • KUBERNETES • RABBITMQ • PGVECTOR</text>
  </g>
</svg>
