<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 600" width="100%" role="img" aria-label="Immersive orbital tech stack diagram">
  <defs>
    
    <linearGradient id="canvas-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091122" />
      <stop offset="50%" stop-color="#060C1A" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    
    <radialGradient id="glow-tr" cx="85%" cy="12%" r="48%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#060C1A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-center" cx="50%" cy="37%" r="36%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#060C1A" stop-opacity="0" />
    </radialGradient>

    
    <radialGradient id="orb-body" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#11224D" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#09132B" stop-opacity="0.98" />
    </radialGradient>
    <linearGradient id="orb-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.8" />
    </linearGradient>

    
    <linearGradient id="glass-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2947" stop-opacity="0.86" />
      <stop offset="100%" stop-color="#0C1528" stop-opacity="0.94" />
    </linearGradient>
    <linearGradient id="glass-border" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#334E7B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.4" />
    </linearGradient>

    
    <radialGradient id="aura-tf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aura-docker" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aura-react" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aura-k8s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aura-py" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aura-pg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aura-aws" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    
    <linearGradient id="dock-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E182D" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0B1325" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0E182D" stop-opacity="0.95" />
    </linearGradient>

    
    <linearGradient id="aws-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="py-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="py-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
  </defs>

  <style>
    .orbit {
      fill: none;
      stroke: #2B4570;
      stroke-width: 1.2;
      opacity: 0.5;
    }
    .orbit-pulse-1 {
      fill: none;
      stroke: #60A5FA;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 34 380;
      opacity: 0.65;
      animation: dashFwd 13s linear infinite;
    }
    .orbit-pulse-2 {
      fill: none;
      stroke: #22D3EE;
      stroke-width: 1.3;
      stroke-linecap: round;
      stroke-dasharray: 24 410;
      opacity: 0.55;
      animation: dashRev 17s linear infinite;
    }
    .orbit-pulse-3 {
      fill: none;
      stroke: #A78BFA;
      stroke-width: 1.2;
      stroke-linecap: round;
      stroke-dasharray: 20 440;
      opacity: 0.45;
      animation: dashFwd 21s linear infinite;
    }

    .node {
      animation: floatNode 5.8s ease-in-out infinite;
    }
    .n1 { animation-delay: 0.0s; }
    .n2 { animation-delay: 0.8s; }
    .n3 { animation-delay: 1.6s; }
    .n4 { animation-delay: 2.4s; }
    .n5 { animation-delay: 3.2s; }
    .n6 { animation-delay: 4.0s; }
    .n7 { animation-delay: 4.8s; }

    .core-breathe {
      animation: breathe 4.8s ease-in-out infinite;
    }
    .status-dot {
      animation: blink 3.2s ease-in-out infinite;
    }

    .core-title {
      font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #E0F2FE;
      letter-spacing: 2px;
      text-anchor: middle;
    }
    .core-sub {
      font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      font-size: 8.5px;
      font-weight: 600;
      fill: #7DD3FC;
      letter-spacing: 1.3px;
      text-anchor: middle;
      opacity: 0.9;
    }

    .dock-bar {
      fill: url(#dock-bg);
      stroke: #1B2C4E;
      stroke-width: 1;
    }
    .pill-text {
      font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.1px;
    }
    .dock-items {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #CBD5E1;
      letter-spacing: 0.25px;
    }

    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.72; }
      50%      { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 1; }
    }
    @keyframes dashFwd {
      to { stroke-dashoffset: -828; }
    }
    @keyframes dashRev {
      to { stroke-dashoffset: 868; }
    }

    @media (prefers-reduced-motion: reduce) {
      .node, .core-breathe, .status-dot, .orbit-pulse-1, .orbit-pulse-2, .orbit-pulse-3 {
        animation: none;
      }
    }
  </style>

  
